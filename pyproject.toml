[project]
name = "autoserial"
version = "0.2.0"
description = "A universal, cross-platform hardware communication library for UART, SPI, I2C, CAN, BLE, USB HID, MQTT, and Network protocols."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Vidath101" }
]
keywords = ["serial", "uart", "spi", "i2c", "can", "ble", "bluetooth", "hid", "mqtt", "hardware", "embedded"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Communications",
    "Topic :: System :: Hardware",
    "Operating System :: OS Independent",
]
dependencies = [
    "pyserial>=3.5",
    "hidapi>=0.14.0",
    "python-can>=4.3.1",
    "bleak>=0.21.1",
    "paho-mqtt>=2.0.0",
    "pyftdi>=0.55.0",
]

[project.urls]
Homepage = "https://github.com/Vidath101/AUTOserial"
Repository = "https://github.com/Vidath101/AUTOserial"
"Bug Tracker" = "https://github.com/Vidath101/AUTOserial/issues"

[build-system]
requires = ["uv_build>=0.11.25,<0.12.0"]
build-backend = "uv_build"
